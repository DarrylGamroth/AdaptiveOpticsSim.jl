schema_version = 1
name = "gate6_grouped_cpu"
evidence_class = "paired warmed in-process serial and fixed-owner grouped CPU logical-timestamp service cost"
samples_per_run = 10000
runs = 3
warmup_timestamps = 2000
allocation_timestamps = 1000
minimum_samples_for_p99 = 10000
histogram_lowest_ns = 1
histogram_highest_ns = 60000000000
histogram_significant_figures = 3
correctness_horizon_ns = 1500000000
max_serial_alloc_bytes_per_timestamp = 2048
max_grouped_alloc_bytes_per_timestamp = 2048
max_alloc_bytes_per_group_call = 512

cpu_contexts = 4
julia_threads = 4
outer_group_owners = 3
group_julia_threads = 1
fft_threads = 1
blas_threads = 1

scope_exclusions = [
    "package import, plant preparation, worker construction, and first-use compilation",
    "fixed-rate open-loop arrivals, wall-clock pacing, overload, and recovery",
    "production SPSC rings, affinity, CPU isolation, NUMA placement, and interrupt placement",
    "external RTC transport, command-response latency, and product publication latency",
    "GPU execution, host-device transfer, and multi-host execution",
    "production instrument scale, MORFEO/NFIRAOS qualification, or a grouped-CPU speedup claim",
]

[contract]
question = "For one representative unequal-rate science/NGS/LGS plant with recurring simultaneous optical samples, can three long-lived externally owned CPU group tasks drive the public batch lifecycle without per-event task creation, nested numerical threading, ownership races, replay differences, or unbounded warmed allocation, and what paired serial/grouped self-paced service-cost distributions result on this host?"
load_model = "paired closed-loop self-paced logical-timestamp service cost measured separately for serial and fixed-owner grouped execution, alternating which mode is measured first across runs; this is not an AO control loop or HIL pacing test"
arrival_model = "the next canonical plant timestamp starts only after the previous timestamp and histogram recording complete"
coordinated_omission_correction = false
coordinated_omission_reason = "the benchmark characterizes unpaced service cost and makes no fixed-arrival latency claim"
timed_boundary = "process every due trigger, detector lifecycle, and optical-path event at one canonical plant timestamp; grouped mode includes benchmark-only command/completion synchronization with already-created workers"
timer = "time_ns; final clock read is included, per-sample histogram recording is excluded from latency and included in achieved throughput"
correctness_oracle = "same-seed exact serial/grouped scheduler cursors, atmosphere epoch, acquisition hashes/sequences/readiness, path RNG streams, atmosphere RNG streams, acquisition RNG streams, and fixed task identities"
threading = "four admitted CPU contexts and Julia threads, three outer path-group owners, one group-local Julia thread, one FFT-provider thread per owner, and one BLAS thread per owner"
first_use = "each mode is recorded after plant and worker construction but before correctness validation or warmup in its own fresh Julia process; package import and preparation are excluded from the timer"
tail_claim = "p99 is reported only with at least 100 expected observations beyond p99 per 10000-sample run; p99.9 remains diagnostic"
latency_gate = "no absolute or relative latency threshold is asserted; serial/grouped ratios are diagnostic until repeated controlled hardware evidence justifies a promotion"
allocation_gate = "serial and benchmark-only grouped orchestration each remain at most 2048 bytes per timestamp; each warmed direct materialization or execution group call remains at most 512 bytes"

