schema_version = 1
name = "gate7_single_gpu"
evidence_class = "paired synchronized closed-loop independent and prepared single-device WFS service cost"
samples_per_run = 200
runs = 3
warmup_operations = 50
minimum_samples_for_p95 = 200
histogram_lowest_ns = 1
histogram_highest_ns = 60000000000
histogram_significant_figures = 3
batched_relative_p95_factor = 1.5

scope_exclusions = [
    "external RTC transport, frame grabbers, command response, publication, and pacing",
    "fixed-rate arrivals, queue residence, saturation, overload, rejection, and recovery",
    "package import, dependency resolution, plant preparation, and context construction",
    "multi-thread CPU execution, CPU affinity, NUMA placement, interrupt isolation, and controlled power state",
    "detector acquisition inside the timed owner boundary; M1-M6 detector/readout correctness is retained by the Gate 7.5 matrix",
    "fused WFS optical kernels, full spectral-bundle detector combination, mixed placement, multi-GPU execution, and peer transfer",
    "production instrument capacity, NFIRAOS/MORFEO qualification, or HIL latency",
]

[contract]
hypothesis = "For two compatible same-device off-axis NGS diffractive Shack-Hartmann paths, one prepared owner reduces the high-level atmosphere/materialization submission proxy from two path submissions to one owner submission and one direction-batch render while preserving the independent result and keeping synchronized p95 service cost within 1.5x."
load_model = "one self-paced operation begins only after the prior synchronized operation completes"
arrival_model = "no independent arrival schedule"
coordinated_omission_correction = false
coordinated_omission_reason = "the contract measures closed-loop service cost, not fixed-arrival response latency"
independent_device_ready_boundary = "advance one logical Plant timestamp with device-owner selection disabled, execute both ordinary path groups, and explicitly synchronize both backend-resident WFS products"
batched_device_ready_boundary = "advance the same logical Plant timestamp through one prepared device owner and explicitly verify and synchronize both backend-resident WFS products"
batched_host_ready_boundary = "batched device-ready completion followed by copies of both WFS products into preallocated host matrices"
transfer_only_boundary = "copy two already-complete WFS products into the same preallocated host matrices"
timer = "time_ns; clock-read and histogram-recording overhead is measured separately and not subtracted"
tail_interpretation = "Each run has 200 observations, so p50, p90, p95, and maximum are reported; p95 has ten expected exceedances and p99 or higher is intentionally not claimed."
first_use_interpretation = "First boundary execution is recorded in declared order after package load and preparation but before boundary warmup; it may include Julia and accelerator kernel compilation and is not used for cross-boundary regression."
submission_proxy_interpretation = "The proxy counts prepared high-level Plant path/owner and atmosphere-render calls; it is not a vendor kernel-launch trace."
baseline_interpretation = "The initial clean CPU, CUDA, and AMDGPU artifacts establish future comparable relative baselines; historical Gate 0 and REVOLT-like artifacts are not equivalent workloads."

[workload]
numeric_type = "Float32"
pupil_resolution = 128
telescope_diameter_m = 8.0
r0_m = 0.2
outer_scale_m = 25.0
fractional_cn2 = [0.65, 0.35]
wind_speed_m_s = [7.0, 11.0]
wind_direction_deg = [20.0, 125.0]
layer_altitude_m = [0.0, 5000.0]
wavelength_m = 7.5e-7
alpha_photon_irradiance = 60.0
alpha_offset_arcsec = 3.0
alpha_azimuth_deg = 25.0
beta_photon_irradiance = 45.0
beta_offset_arcsec = 7.0
beta_azimuth_deg = 145.0
lenslets = 16
samples_per_subaperture = 8
path_count = 2
sample_period_ns = 1000000
witness_phase_ns = 1000000000000
witness_period_ns = 2000000000000
run_seed = 28678
parity_rtol = 8.0e-5
parity_atol = 8.0e-5

[submission_proxy.independent]
top_level_path_submissions = 2
device_owner_submissions = 0
atmosphere_direction_render_calls = 2
wfs_optics_calls = 2

[submission_proxy.batched]
top_level_path_submissions = 0
device_owner_submissions = 1
atmosphere_direction_render_calls = 1
wfs_optics_calls = 2

[placements.local_cpu]
backend = "cpu"
host_class = "local"
boundaries = ["independent_device_ready"]

[placements.local_cpu.independent_device_ready]
absolute_p95_ns = 500000000
max_alloc_bytes = 65536

[placements.local_amdgpu]
backend = "amdgpu"
host_class = "local"
boundaries = [
    "independent_device_ready",
    "batched_device_ready",
    "batched_host_ready",
    "transfer_only",
]

[placements.local_amdgpu.independent_device_ready]
absolute_p95_ns = 3000000000
max_alloc_bytes = 4194304

[placements.local_amdgpu.batched_device_ready]
absolute_p95_ns = 3000000000
max_alloc_bytes = 4194304

[placements.local_amdgpu.batched_host_ready]
absolute_p95_ns = 3000000000
max_alloc_bytes = 4194304

[placements.local_amdgpu.transfer_only]
absolute_p95_ns = 500000000
max_alloc_bytes = 4194304

[placements.wsl_cuda]
backend = "cuda"
host_class = "wsl"
boundaries = [
    "independent_device_ready",
    "batched_device_ready",
    "batched_host_ready",
    "transfer_only",
]

[placements.wsl_cuda.independent_device_ready]
absolute_p95_ns = 500000000
max_alloc_bytes = 4194304

[placements.wsl_cuda.batched_device_ready]
absolute_p95_ns = 500000000
max_alloc_bytes = 4194304

[placements.wsl_cuda.batched_host_ready]
absolute_p95_ns = 500000000
max_alloc_bytes = 4194304

[placements.wsl_cuda.transfer_only]
absolute_p95_ns = 500000000
max_alloc_bytes = 4194304
