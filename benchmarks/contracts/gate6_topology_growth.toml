schema_version = 1
name = "gate6_topology_growth_cpu"
evidence_class = "fresh-process CPU preparation and generated-code growth characterization"
gate5_workload_contract = "gate5_optical_placement.toml"
fresh_process_repetitions_per_first_use_mode = 3
warmup_cycles = 100
allocation_cycles = 100
service_samples_per_run = 2000
service_runs = 3
histogram_lowest_ns = 1
histogram_highest_ns = 60000000000
histogram_significant_figures = 3
topology_resolution = 8

max_preparation_elapsed_ns = 30000000000
max_preparation_allocated_bytes = 1342177280
max_first_event_invocation_ns = 10000000000
max_first_selection_invocation_ns = 10000000000
max_prepared_summary_bytes = 1048576
max_largest_to_small_preparation_time_ratio = 2.5
max_largest_to_small_preparation_allocation_ratio = 2.5
max_largest_to_small_prepared_storage_ratio = 4.25
max_warmed_alloc_bytes_per_path_per_cycle = 1024
max_entry_native_code_size_ratio = 1.05
max_entry_method_instance_count_growth = 0
max_distinct_registry_type_fingerprints = 1
max_stage_kernel_any_slots = 0

scope_exclusions = [
    "package import, dependency resolution, and Julia process startup",
    "fixed-rate arrivals, wall-clock pacing, queues, overload, and recovery",
    "external RTC transport, detector publication, and command-response latency",
    "parallel CPU execution, CPU affinity, NUMA placement, and interrupt isolation",
    "GPU execution, host-device transfer, and multi-GPU placement",
    "production instrument fidelity, production capacity, or NFIRAOS/MORFEO qualification",
]

[contract]
question = "Across predeclared 4/8/16-path plant shapes, do whole-plant topology registries keep cardinality out of prepared owner types and HIL entry signatures while retaining inferred concrete numerical stage kernels, bounded fresh preparation growth, linear prepared storage, and bounded warmed service allocation?"
topology_labels = "development, nfiraos_like, and morfeo_like are cardinality labels for this synthetic Gate 5 optical-placement fixture only; they make no instrument-model, fidelity, throughput, or capacity claim"
load_model = "fresh-process cold preparation plus closed-loop self-paced warmed serial service-cost characterization; this is not an external-RTC or fixed-arrival HIL latency test"
arrival_model = "the next optical cycle starts only after the prior cycle and histogram recording complete"
coordinated_omission_correction = false
coordinated_omission_reason = "warmed histograms characterize unpaced service cost and support no fixed-arrival latency claim"
preparation_boundary = "construct the synthetic declared plant, prepare all command endpoints, controllable optics, sampled aberrations, optical paths, acquisitions, RNG owners, event definitions, event loop, state, workspace, and all-acquisition schedule-free selection after package loading in a fresh Julia process"
first_use = "record the first event-loop cycle and first all-acquisition schedule-free selection independently after preparation and before warmup in separate fresh Julia processes"
generated_code_proxy = "compare exact registry-owner type fingerprints, entry-method specialization counts, and native-code text sizes for the schedule-free selection and serial event-loop entries; concrete representative path and acquisition kernels must contain no exact Any slot or SSA value"
allocation_gate = "after warmup, the serial all-path optical cycle remains at most 1024 Julia heap bytes per declared path per cycle over a 100-cycle window; this bounds the deliberate heterogeneous-owner dispatch barrier while numerical stage kernels remain allocation-free"
latency_gate = "only cold preparation, first-invocation, storage, type, method-instance, native-code-size, and allocation ceilings are acceptance gates; warmed histogram percentiles are diagnostic"
threading = "one Julia thread, one BLAS thread, and one FFT-provider thread"

[[topologies]]
label = "development"
path_count = 4
acquisition_count = 4
controllable_optic_count = 5
command_endpoint_count = 5
sampled_aberration_count = 3

[[topologies]]
label = "nfiraos_like"
path_count = 8
acquisition_count = 8
controllable_optic_count = 7
command_endpoint_count = 7
sampled_aberration_count = 5

[[topologies]]
label = "morfeo_like"
path_count = 16
acquisition_count = 16
controllable_optic_count = 11
command_endpoint_count = 11
sampled_aberration_count = 9
