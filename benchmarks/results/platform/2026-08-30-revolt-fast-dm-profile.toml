hypothesis = "Embedding the exact 277-element provisional HSDM277 command in its regular 19-by-19 grid permits a separable Gaussian evaluation that removes the dominant CPU DM cost without reducing optical sampling or changing the graph's scientific contracts."

[contract]
graph_profile = "fast_dm"
selection = "run immutable and selected before graph preparation"
load_model = "warmed serial closed loop"
arrival_model = "the next step starts only after the prior step completes"
coordinated_omission_correction = false
timer = "time_ns; timer overhead is included and not subtracted"
julia_threads = 1
blas_threads = 1
fft_threads = 1
graph_boundary = "all graph nodes plus one exact graph-context synchronization"
frame_host_ready_boundary = "graph boundary plus a completed target-to-host frame copy"
command_target_ready_boundary = "finite host command validation plus a completed host-to-target command copy"
per_node_boundary = "one node invocation plus exact graph-context synchronization"
tail_note = "The percentiles are diagnostic and do not establish a production tail-latency bound."
validity_note = "The fast-DM files differ from their full_optical counterparts only in the provisional HSDM277 node type and the parameter that maps the exact command order into the declared regular grid. Atmosphere, pupil sampling, WFS propagation and modulation, detector acquisition and noise, output frame shape, and model-time step are unchanged."

[workload.classic]
