[interpretation]
classic_cpu_primary_limit = "atmosphere evolution, diffractive Shack-Hartmann formation, and noisy detector acquisition"
copper_primary_limit = "32-point diffractive Pyramid sensing"
notes = [
    "The separable-grid implementation removes the provisional Gaussian DM as a material CPU cost while retaining its declared surface model.",
    "Classic CPU host-ready throughput increases materially because the general Gaussian DM was its dominant node.",
    "Copper CPU frame-level comparisons are not attributed to the DM change: independently prepared 32-point Pyramid plans show multi-second variation that is much larger than the remaining DM cost.",
    "The tested GPU paths already evaluated the general Gaussian DM in under one millisecond, so their end-to-end rate changes are small and should be treated as run variation rather than capacity gains.",
    "A measured or irregular HSDM277 influence calibration cannot use this specialization unless its own structure independently justifies an equivalent factorization.",
]

