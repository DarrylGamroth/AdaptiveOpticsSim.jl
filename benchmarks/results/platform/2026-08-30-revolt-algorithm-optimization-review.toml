hypothesis = "The full-resolution REVOLT graphs can be accelerated without reducing pupil or detector resolution by exploiting exact regular-grid DM separability, amortizing CPU FFT planning, batching independent accelerator Pyramid modulation points, and fusing scalar Shack-Hartmann sampling passes."

