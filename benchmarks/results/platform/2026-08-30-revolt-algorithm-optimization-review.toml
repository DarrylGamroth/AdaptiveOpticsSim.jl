[algorithm_assessment.separable_grid_gaussian_dm]
decision = "retain"
equivalence = "Mathematically equivalent to dense analytic Gaussian evaluation for the declared regular Cartesian actuator grid; floating-point evaluation order is different."
observed_relative_error = "approximately 5e-7 or less in focused CPU and accelerator comparisons"
benefit = "Removes the dominant CPU DM cost without changing optical sampling."
scope = "Provisional HSDM277 regular-grid response only; measured influence calibration remains the production-fidelity target when available."

[algorithm_assessment.pyramid_modulation_batch]
decision = "retain"
equivalence = "Independent modulation points are evaluated in bounded accelerator tiles and accumulated in the original point order."
observed_error = "Bitwise-identical full 480-by-480, 32-point AMDGPU native intensity in the direct sequential-versus-batched comparison at revision e4ead50."
benefit = "Amortizes accelerator FFT and kernel-launch overhead while preserving the complete-frame Pyramid result."
memory_tradeoff = "One bounded accelerator-only field stack with at most eight modulation planes; about 64 MiB for the REVOLT Copper Float32 configuration."

[algorithm_assessment.repeated_cpu_fft_planning]
decision = "retain"
equivalence = "The DFT is unchanged, but FFTW.MEASURE may choose a different floating-point operation schedule and is therefore not bitwise equivalent to the estimate-planned path."
observed_relative_error = "1.42e-7 for the full REVOLT Classic Shack-Hartmann photon-rate product in the focused comparison"
benefit = "The full Classic Shack-Hartmann node decreased from about 3.60 ms to about 3.08 ms before the fused sampling change."
preparation_tradeoff = "The first clean Classic CPU graph preparation took 5.50 s; a second preparation in the same process reused FFTW wisdom and took 0.12 s. Planning remains outside repeated execution."

[algorithm_assessment.scalar_shack_hartmann_sampling]
decision = "retain"
equivalence = "Bitwise equivalent to the prior per-plane bin, centered resize, and stack-copy composition; the bin accumulation order is preserved."
observed_error = "zero in the direct regression fixture"
allocation_bytes_after_warmup = 0
microbenchmark = "0.351 ms to 0.187 ms for the full Classic spot stack in the focused prototype, a 1.87x sampling-stage speedup"

[algorithm_assessment.detector_poisson_sampling]
decision = "retain current sampler"
profile_share = "approximately 90 percent of the Classic detector node"
workload_distribution = "mean expected count 6.15; 95.4 percent of pixels at or below 30 expected counts"
rejected_alternative = "Exact inverse-CDF recurrence"
reason = "The focused test increased the photon-sampling time from 2.55 ms to 2.81 ms. Counter-based or approximate alternatives would change reproducibility or noise fidelity and require an explicit model choice."

[algorithm_assessment.valid_lenslet_compression]
decision = "do not implement"
workload = "212 of 256 Classic lenslets are valid"
reason = "The maximum transform-count reduction is only 17.2 percent and does not justify a second packed layout, scatter path, and rebuild contract at this point."

[algorithm_assessment.atmosphere]
decision = "retain current finite multilayer evolution"
current_classic_cpu_mean_ns = 1726335.83
reason = "The five-layer 240-by-240 atmosphere is no longer the dominant node, and no lower-complexity replacement was identified that preserves the same evolving finite-screen model."

