evidence_class = "warmed synchronized diagnostic profile"
raw_histograms_archived = false
hypothesis = "An explicit reduced-resolution graph can preserve the REVOLT external HIL contract while substantially reducing complete-frame service cost."

[contract]
fidelity = "reduced_resolution"
selection = "run immutable and selected before graph preparation"
load_model = "warmed serial closed loop"
arrival_model = "the next step starts only after the prior step completes"
coordinated_omission_correction = false
samples = 100
warmup_cycles = 10
timer = "time_ns; timer overhead is included and not subtracted"
julia_threads = 1
blas_threads = 1
fft_threads = 1
graph_boundary = "all graph nodes plus one exact graph-context synchronization"
frame_host_ready_boundary = "graph boundary plus a completed target-to-host frame copy"
command_target_ready_boundary = "finite host command validation plus a completed host-to-target command copy"
lockstep_cycle_boundary = "frame-host-ready boundary immediately followed by same-sequence command adoption"
tail_note = "The 100-sample percentiles are diagnostic and do not establish a production tail-latency bound."
validity_note = "Reduced resolution preserves the declared atmosphere trajectory model, physical-DM command semantics, diffractive sensor family, external frame shape, and HIL sequence contract. It does not establish full-optical image, modulation, or detector-noise parity."

[workload.classic]
graph = "examples/graphs/revolt_classic_hil_reduced_resolution.toml"
pupil_resolution = 128
full_optical_pupil_resolution = 240
sensor = "diffractive Shack-Hartmann"
lenslets = 16
diffraction_padding = 1
detector_frame_shape = [352, 352]
detector_noise = false
atmosphere_layers = 5
atmosphere_step_s = 0.001
dm_actuators = 277
dm_model = "provisional sampled-topology analytic Gaussian HSDM277"

[workload.copper]
graph = "examples/graphs/revolt_copper_hil_reduced_resolution.toml"
pupil_resolution = 240
full_optical_pupil_resolution = 480
sensor = "diffractive modulated Pyramid"
modulation_points = 4
full_optical_modulation_points = 32
diffraction_padding = 1
detector_frame_shape = [64, 64]
detector_noise = false
atmosphere_layers = 5
atmosphere_step_s = 0.002
dm_actuators = 277
dm_model = "provisional sampled-topology analytic Gaussian HSDM277"

