artifact_id = "GPU-KERNEL-EFFICIENCY-RTX3080-2026-10-21"
base_revision = "50741bc95f5b8af2ee2947ef9504f11fbffe3aa3"
objective = "Assess execution architecture and representative GPU kernel patterns on RTX3080; no instrument-specific optimization or claim that all algorithms are optimal."
decision = "Prioritize synchronization/completion policy and geometric-slopes work decomposition; retain production implementations pending scoped remediation and numerical qualification."

[scope]
source_kernel_definitions = 138
source_families = "44 WFS,32 detector,23 optics,16 atmosphere,12 backend,5 core,3 tomography,2 algorithm-graph,1 calibration"
measured = "13 nodes from captured DM/SH/detector plant;14 synthetic production-launch kernel patterns;4 Pyramid strategy/size fixtures,3 fresh processes per wait policy;6 experimental slopes fixtures."
unmeasured = "Not an exhaustive audit of every kernel/configuration. Stochastic RNG/Poisson, infinite-screen evolution, direction batching, cold covariance/tomography builds, full LiFT inverse, and complete Bi-O-edge/curvature/Zernike workflows lack new focused measurements. Shared pointwise/FFT patterns are not proof of their performance."
production_changes = false

[environment]
gpu = "NVIDIA GeForce RTX3080 sm86;68 SMs"
driver = "615.71.09"
cuda_runtime = "13.4.0"
cuda_jl = "6.4.2"
kernel_abstractions = "0.9.45"
julia = "1.13.2"
cpu = "AMD Ryzen7 6800H"
affinity = "Julia CPU2, one compute thread, zero interactive, one GC, OPENBLAS_NUM_THREADS=1"
clocks = "Uncontrolled system defaults; no changes to power,clock,driver or profiler access policy"
manifest_sha256 = "30a87806f0b9cbbe27d951f019f9f801d46236fe3e1792aab716c5ea8014ef73"

[method]
patterns = "Production Backends.preferred_workgroupsize selected before execution:16x16 in all14 cases.64 CUDA event samples, each graph32 reset+kernel operations; per-operation times include reset and graph scheduling. One fresh process; diagnostic baseline, not regression gate."
pattern_oracle = "CPU execution of same KA kernels; backend parity, input immutability and post-replay stability. Utility reduction also exact Float64 oracle. Not independent physical validation. All passed."
counters = "NsightCompute2026.3.1; single warmed kernel occurrences; basic+Occupancy+SchedulerStats, plant MemoryWorkloadAnalysis, patterns MemoryWorkloadAnalysis_Tables. Replay/cache/clock perturbation: durations diagnostic, not production latency. Raw metric names and units retained; do not confuse Memory Throughput percent with Gbyte/s."
pyramid = "Complete synchronized stream optics+noiseless acquisition,128 host time_ns samples after32 warmups perfixture; default vs process-local blocking synchronize_backend! specialization.3 fresh processes per policy, fixed default-then-blocking campaign and fixedcase order. No paired randomized causal estimate."
pyramid_oracle = "Complete GPU frames compared to CPU for each strategy/size before and after. Stable CUDA.used_memory.0 timed GC collections. Caller OPD and physical algorithms unchanged."
blocking_scope = "Benchmark-only more-specific Backends.synchronize_backend!(AcceleratorStyle{CUDA.CUDABackend}) invokes CUDA.synchronize(blocking=true). Changes every AOS synchronization call in that process while retaining boundaries/current-stream scope. Implicates synchronization policy and bookkeeping collectively, not scheduler-only causality. It changes Julia task cooperation and requires latency/concurrency qualification before adoption."
source_provenance = "Pyramid trace preceded addition of outside-timer GC counters and opt-in blocking dispatch; default step helper and package kernels unchanged. Current retained driver hashes do not claim byte-identical driver source for the earlier trace."
timeline = "NsightSystems2026.3.2, four cudaProfilerApi regions32 steps each. Kernel interval union divided by first host launch to final kernel/synchronization end. Profiler changed the slow unprofiled wait behavior; use only for GPU-work mix, not unprofiled latency. Printed profile wall time can include collection/flush."
boundary = "Benchmark-only exact-real telescoping of ordinary unmasked-pixel finite differences, not edge-masked slopes.6 fixtures:3 shapes including sub1, each smooth/nonsmooth field and mixed validity masks;4 ABBA groups64 event samples/block,32 reset+kernel operations. Same production16x16 group. Numerical reassociation explicitly unqualified outside fixtures."
limitations = "Synthetic bounded Float32 inputs; one hardware/software stack and shared host. No WCET/tail/deadline guarantees, no clock locking, no whole-application or cross-backend optimality claim. Blocking-policy campaign fixed order and CPU2 affinity can affect magnitude."

[commands]
common_environment = "JULIA_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1; taskset -c 2; --threads=1,0 --gcthreads=1; apply to profiler commands too"
pattern_baseline = "JULIA_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 taskset -c 2 julia --startup-file=no --threads=1,0 --gcthreads=1 --project=test/cuda benchmarks/profile_gpu_kernel_patterns_cuda.jl /tmp/patterns.toml"
pattern_counters = "AOS_GPU_PATTERN_PROFILE=1 ncu --clock-control none --cache-control none --profile-from-start off --launch-count 40 --set basic --section Occupancy --section MemoryWorkloadAnalysis_Tables --section SchedulerStats --export /tmp/patterns julia --startup-file=no --threads=1,0 --gcthreads=1 --project=test/cuda benchmarks/profile_gpu_kernel_patterns_cuda.jl /tmp/patterns-profiled.toml"
plant_counters = "AOS_SH_OCCUPANCY_GROUP=default ncu --clock-control none --cache-control none --profile-from-start off --graph-profiling node --launch-count 13 --set basic --section Occupancy --section MemoryWorkloadAnalysis --section SchedulerStats --export /tmp/plant julia --startup-file=no --threads=1,0 --gcthreads=1 --project=test/cuda benchmarks/profile_sh_pupil_occupancy_cuda.jl cuda"
pyramid_baseline = "JULIA_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 AOS_PYRAMID_RESULTS=/tmp/pyramid.toml taskset -c 2 julia --startup-file=no --threads=1,0 --gcthreads=1 --project=test/cuda benchmarks/profile_pyramid_efficiency_cuda.jl"
pyramid_blocking = "Same command with AOS_PYRAMID_BLOCKING_SYNC=1, in a separate fresh process; repeat each policy3 times."
pyramid_timeline = "AOS_PYRAMID_PROFILE=1 AOS_PYRAMID_RESULTS=/tmp/pyramid-traced.toml nsys profile --sample=none --cpuctxsw=none --trace=cuda,nvtx --cuda-graph-trace=node --capture-range=cudaProfilerApi --capture-range-end=repeat:4:defer --output=/tmp/pyramid julia --startup-file=no --threads=1,0 --gcthreads=1 --project=test/cuda benchmarks/profile_pyramid_efficiency_cuda.jl"
boundary = "JULIA_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 taskset -c 2 julia --startup-file=no --threads=1,0 --gcthreads=1 --project=test/cuda benchmarks/benchmark_geometric_slopes_boundary_cuda.jl /tmp/boundary.toml"
counter_text = "ncu --import <report>.ncu-repz --page details --csv; also --page raw --csv for metric identities/units"
timeline_export = "nsys export --type sqlite --output <report>.sqlite <report>.nsys-rep"

