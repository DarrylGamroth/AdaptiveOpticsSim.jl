[[priority]]
id = "GPU-EFF-1"
status = "Observed synchronization-policy sensitivity"
priority = 1
evidence = "N256 pupil-tilt default median about8ms vs blocking about405us in3 fresh processes/policy, CPU-parity frames,0GC. Trace has about350us device-kernel activity/step. Wait policy/bookkeeping dominates this baseline."
action = "Preserve asynchronous composition and choose explicit completion policy for latency-sensitive prepared execution. Profile task cooperation/multithread affinity before changing defaults; do not select physical propagation strategy solely to avoid a wait artifact."
source = "src/backends/arrays.jl:799; benchmarks/profile_pyramid_efficiency_cuda.jl"

[[priority]]
id = "GPU-EFF-2"
status = "Observed sparse grid and expensive finite-difference loop"
priority = 2
evidence = "Geometric slopes has4blocks for1024 outputs,39registers,under1% aggregate SM throughput; global loads about32sectors/request.16-to32pixels per subaperture increases measured kernel time75to527us."
action = "Evaluate boundary-difference formulation for ordinary slopes and/or cooperative work per subaperture. Validate reassociation over adversarial/scientific OPDs and scales; edge-masked slopes require a different algorithm."
source = "src/wfs/geometric_slopes.jl:1"

[[priority]]
id = "GPU-EFF-3"
status = "Observed useful throughput; library comparison unmeasured"
priority = 3
evidence = "Larger custom separable-DM right pass reaches79% SM throughput with64-term dot products. Grid capture uses custom dots; dense/measured native DMs already use retained-coefficient cuBLAS GEMV."
action = "Compare captured custom separable passes against capture-safe prepared GEMM across shapes, including pupil-mask pass and workspace cost. Do not assume tensor cores/TF32 meet numerical policy."
source = "src/optics/deformable_mirror.jl:66; src/optics/deformable_mirror.jl:1062"

[[priority]]
id = "GPU-EFF-4"
status = "Observed bandwidth use and workload-size sensitivity"
priority = 4
evidence = "cuFFT stages and abs2 achieve about70% DRAM throughput in plant sample;32-point Pyramid intensity reduction reaches86.8%. Moving-layer interpolation reaches67.7% SM throughput. Detector31tap rows/cols differ24.7vs15.1us in counters."
action = "Prioritize bytes/work removed, batching, and stencil reuse over occupancy increases. Tiling/fusion alternatives remain hypotheses until benchmarked at the same output semantics."
source = "src/wfs/pyramid/setup.jl:74; src/atmosphere/multilayer.jl:59; src/detectors/interface.jl:1644"

[[priority]]
id = "GPU-EFF-5"
status = "Source observation and low-priority utility measurement"
priority = 5
evidence = "Small copy/scale kernels have low compute utilization despite high occupancy. Scalar atomic masked_sum is slow in a utility fixture but has no production caller in this checkout. No local-memory load traffic observed in14 pattern samples."
action = "Remove/fuse redundant data movement where bindings permit; do not optimize dormant utilities or rewrite every Int toInt32 on source appearance alone. Inspect generated code for measured targets."
source = "src/backends/arrays.jl:744; src/backends/reductions.jl:2"

