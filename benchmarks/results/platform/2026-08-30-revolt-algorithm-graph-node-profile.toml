hypothesis = "Per-node timing will identify whether atmosphere evolution, optical sensing, detector acquisition, or provisional HSDM277 surface formation limits the complete REVOLT Classic and Copper HIL graphs."

[contract]
load_model = "warmed serial closed loop"
arrival_model = "the next step starts only after the prior step completes"
coordinated_omission_correction = false
timer = "time_ns; timer overhead is included and not subtracted"
julia_threads = 1
blas_threads = 1
fft_threads = 1
per_node_boundary = "one node invocation plus exact graph-context synchronization"
graph_boundary = "all graph nodes plus one exact graph-context synchronization"
frame_host_ready_boundary = "graph boundary plus a completed target-to-host frame copy"
command_target_ready_boundary = "finite host command validation plus a completed host-to-target command copy"
per_node_sum_caveat = "GPU node measurements synchronize each node separately and are diagnostic; their sum need not equal integrated graph time."
tail_note = "The 10-sample Copper CPU percentiles are diagnostic only. The 50- and 100-sample runs support p50 and p90 comparisons, not a production tail-latency claim."

