[protocol]
workload = "Default instrument atmosphere/noisy detector production graph, zero commands; no transport/RTC. Full-resolution noiseless calibration self-parity uses one deterministic OPD and sparse nonzero command probe."
timing = "One fresh process per instrument; stream then captured when admitted; 32 warmups and 32 closed-loop time_ns samples per endpoint. Completed GPU graph outputs and completed host-frame/same-sequence zero-command adoption measured separately. No production tail/deadline or causal small-effect claim."
allocations = "One warmed @allocated sample per timed endpoint. Classic/Copper captured HIL allocation confirmed by 16 additional samples in independent processes. Native graph node recursion checked for allocation/free nodes. Stable CUDA.used_memory alone is retained-memory evidence, not a device allocation measurement."
numerical = "CPU/GPU full-resolution noiseless stream parity. Classic/Copper GPU stream versus captured deterministic frame and photon rate exactly matched for the probe. No noisy CPU/GPU equivalence or independent instrument scientific accuracy claim. Seeded reset tested separately in each production execution policy."
timeline = "Separate fresh profiled process; two cudaProfilerApi ranges where capture admitted, otherwise one. Each includes 64 completed GPU graph frames and 64 complete HIL cycles, separated by NVTX ranges. Percentages are interval unions of kernel activities, or kernel+copy+memset activities, divided by enclosing NVTX range duration. Reset outside selected NVTX intervals. Not SM occupancy or unprofiled wall-time utilization."
counters = "One occurrence per selected kernel in actual instrument stream execution: Classic photon Poisson first match, Copper dominant batched FFT second regular_fft match (first single forward FFT skipped). Nsight Compute replay, basic + Occupancy + SchedulerStats + MemoryWorkloadAnalysis; no clock/cache control. Diagnostic one-kernel metrics; replay durations are not service latency. No counter coverage of every GPU algorithm."
limitations = "One shared GPU/software stack; uncontrolled clocks and fixed case order. Self-paced workload excludes RTC, PipeWire, queueing and external command arrival. Profile instrumentation perturbs waits/timings; use unprofiled samples for service times. Model cadence is not an achieved hardware execution rate. No physical bench or on-sky validation."
telemetry = "Nominal 250 ms plus nvidia-smi query time; whole baseline/timeline campaign including compilation/warmup. Follow-up native inspections/counters are outside this telemetry window. No stable-clock claim."

[conclusions]
application = "All scenario launchers default to stream execution; the workspace does not expose a captured-execution selector. Registered AOS dependency use preserved; recent development changes are not automatically deployed."
capture = "Classic/Copper explicit capture admits five graph nodes and measured zero Julia bytes for GPU graph replay; native graph inspection finds kernels/memsets only. Complete captured HIL cycles allocate 160 Julia bytes repeatedly on this stack. GPI2 capture rejects at its custom command-routing owner; frame-layout owner also lacks qualification."
science = "Declared mathematical conventions are consistent within reviewed scope. GPI2 normalized detector sampling is twice producer metadata; no present pixel-value effect. Known EM clipped-Gaussian approximation has +8.3315% conditional single-electron mean bias before read noise, not a measured frame-wide bias. Photon noise uses a rounded Gaussian approximation at means >=30. One atmosphere sample/exposure and fast Pyramid/quadrature settings require application convergence studies."
oracles = "AOS has genuine pinned OOPAO component exports; SPECULA-targeted fixtures are regenerated through AOS, without independent SPECULA producer provenance. No complete-instrument independent SPECULA or measured-frame qualification was found. CPU/GPU self-parity is not an independent scientific oracle."
api = "Prioritize GPI2 capture conformance, public immutable boundary metadata/needed semantic accessors, and retained first-failure diagnostics. Investigate failed-drain storage lifetime before implementing retention. Defer declaration macros and streaming/rejection semantics absent an instrument requirement."

