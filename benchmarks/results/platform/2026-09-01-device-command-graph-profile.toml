[interpretation]
verdict = "HIP Graph replay is functional, but this one-node capture scope does not establish a material end-to-end throughput gain."
notes = [
    "All captured-policy graphs reported exactly one native HIP Graph node and produced finite, nonzero frames while the atmosphere evolved.",
    "Mean-of-run-means reductions were 1.6% for Classic graph target-ready, 4.3% for Classic frame host-ready, 0.6% for Copper graph target-ready, and 1.1% for Copper frame host-ready.",
    "Every stream and captured run-mean range overlaps for the corresponding boundary, and the first Classic stream run showed substantially more unrelated detector and WFS variation than the repeat.",
    "The captured DM is already a small fraction of either complete graph. Copper remains dominated by the 32-point Pyramid calculation; Classic remains dominated by noisy detector acquisition and Shack-Hartmann formation.",
    "The result justifies retaining conservative opt-in capture as a foundation for future qualified clusters. It does not justify making capture the default or claiming whole-graph capture.",
]

