artifact_id = "SH-PUPIL-MATRIX-CUDA-2026-10-21"
generated_on = "2026-10-21"
base_revision = "e3ba13f8f2fd21157f2d8089929fd8ddef8a20c6"
decision = "Keep the production default. A universal (44,8,1,1) regresses several pupil geometries. Pad44 improves isolated-kernel time and is promising for separately scoped tuning; this sweep does not justify a universal default."
source_state = "Benchmark-only changes and profiler script identified by hashes below. Production package source and dependencies unchanged."

[environment]
gpu = "NVIDIA GeForce RTX 3080 sm86"
cpu = "AMD Ryzen 7 6800H"
driver = "615.71.09"
cuda_runtime = "13.4.0"
cuda_jl = "6.4.2"
kernel_abstractions = "0.9.45"
julia = "1.13.2"
kernel = "6.12.111+deb13-amd64"
threads = "1 compute, 0 interactive, 1 GC; BLAS and FFT threads 1"
affinity = "Julia CPU2; passive monitor CPU6"
clocks = "System defaults; no clock locking or CPU isolation"
cuda_manifest_sha256 = "30a87806f0b9cbbe27d951f019f9f801d46236fe3e1792aab716c5ea8014ef73"

[protocol]
cases = 10
fresh_processes_per_case = 3
campaign = "Nine cases per process in fixed ascending-size order; maintained N64/L8 case measured separately in three fresh processes after the matrix. Comparisons alternate ABBA/BAAB and candidate order rotates within each case."
groups_per_comparison_per_process = 4
plant_samples_per_block = 256
kernel_events_per_block = 32
pupil_kernels_per_event = 64
total_timed_plant_steps = 245760
total_kernel_event_samples = 30720
comparison = "Default vs unchanged default control and default vs (44,8,1,1); only pupil kernel launcher specialized in benchmark process."
paired_effect_formula = "For each comparison and round, exp(mean(log(candidate block p50))-mean(log(paired baseline block p50))). Geometric mean of four round ratios per process minus 1, times 100. Negative is faster. Three process results retained separately."
inputs = "Fixed deterministic Float32 nominal command during timing; changed commands 0,-0.7,1.3 times nominal checked outside timing with synchronized cold GPU input writes."
oracles = "CPU complete-frame parity before/after and changed commands; raw pupil byte equality; zero warmed plant Julia heap bytes, zero timed GC collections, unchanged CUDA.used_memory per block; all passed."
plant_boundary = "Host time_ns around complete captured plant step including wait; concurrency one."
kernel_boundary = "CUDA events around graph of64 identical pupil kernels; scheduling overhead amortized per kernel."
percentile_convention = "Pooled plant p50/p99 use linear interpolation at (n-1)p; raw block p50 is median and p90/p99 use nearest rank."
limitations = "Shared host, uncontrolled clocks, fixed case order. Empirical p99/max are descriptive, not WCET/deadline guarantees. Kernel samples average64 launches; event bookkeeping may allocate host memory."

[representative_sources]
production = "benchmarks/support/revolt_like_hil_common.jl:143-145 and contracts/pre_hil_backend_latency.toml:44-46: N352/L16"
maintained_example = "examples/support/hil_reference_systems.jl:32-33: N64/L8"
synthetic = "Remaining cases vary pupil sampling and lenslet count to test launch geometry; no claim of independent physical validation."

[occupancy_protocol]
tool = "Nsight Compute 2026.3.1"
case = "N352/L16; pupil ndrange(44,44,16,16)"
collection = "One warmed pupil node inside complete captured plant step per launch choice; basic counters and Occupancy section, graph-profiling node, external CUDA profiler range."
definition = "Achieved occupancy is average active warps per SM divided by maximum resident warps during the pupil kernel, not whole-application GPU utilization."
interpretation = "44x8 lowers both theoretical and achieved occupancy while improving isolated kernel time. Occupancy alone does not select the fastest launch."
limitations = "Profiler replay and uncontrolled cache/clock state affect duration. Profiled durations are diagnostic and are excluded from unprofiled event/plant timing results. Both CPU frame oracles passed."

[commands]
matrix = "JULIA_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 AOS_SH_MATRIX=1 AOS_SH_ROUNDS=4 AOS_SH_SAMPLES=256 AOS_SH_RESULTS=/tmp/run1.toml taskset -c 2 julia --startup-file=no --threads=1,0 --gcthreads=1 --project=test/cuda benchmarks/benchmark_sh_pupil_workgroups_cuda.jl cuda"
maintained_example = "JULIA_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 AOS_SH_RESULTS=/tmp/run1-N64-L8.toml taskset -c 2 julia --startup-file=no --threads=1,0 --gcthreads=1 --project=test/cuda -e 'include(\"benchmarks/benchmark_sh_pupil_workgroups_cuda.jl\"); benchmark_sh_workgroups(; pupil_resolution=64, lenslets_per_axis=8, groups=_SH_MATRIX_GROUPS, output=ENV[\"AOS_SH_RESULTS\"])' cuda"
occupancy = "AOS_SH_OCCUPANCY_GROUP=default JULIA_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 /opt/nvidia/nsight-compute/2026.3.1/ncu --clock-control none --cache-control none --profile-from-start off --graph-profiling node --kernel-name-base demangled --kernel-name regex:gpu_sh_explicit_pupil_stack_kernel_ --launch-count 1 --set basic --section Occupancy --csv --export /tmp/occupancy-default --force-overwrite julia --startup-file=no --threads=1,0 --gcthreads=1 --project=test/cuda benchmarks/profile_sh_pupil_occupancy_cuda.jl cuda"
occupancy_repeat = "Repeat with AOS_SH_OCCUPANCY_GROUP=44x8 and a distinct export path. Import reports with ncu --import <report>.ncu-repz --page details --csv."
telemetry = "nvidia-smi --query-gpu=clocks.current.sm,clocks.current.memory,pstate,temperature.gpu,power.draw,clocks_event_reasons.active --format=csv,noheader,nounits; nominal100ms plus query latency; CLOCK_MONOTONIC query brackets retained."

