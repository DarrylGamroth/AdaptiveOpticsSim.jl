[architecture_timeline_protocol]
tool = "Nsight Systems 2026.3.2"
interpretation = "Execution architecture comparison on one deterministic resident workload; these are trace activity fractions, not per-kernel SM occupancy or full-instrument utilization."
command = "JULIA_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 AOS_PROFILE_REPLAYS=256 taskset -c 2 nsys profile --sample=none --cpuctxsw=none --trace=cuda,nvtx --cuda-graph-trace=node --capture-range=cudaProfilerApi --capture-range-end=repeat:2:defer --output=/tmp/architecture-timeline julia --startup-file=no --threads=1,0 --gcthreads=1 --project=test/cuda benchmarks/profile_aos_gpu_plant.jl cuda both"
formula = "Union of device kernel [start,end] intervals divided by interval from first host kernel/graph launch start to final kernel or synchronization end, whichever is later; per capture range."
oracles = "CPU complete frames before/after; stable used device memory for each policy; captured warmed heap0B, checked-stream7120B; CPU reference unchanged."
limitations = "One fresh process, fixed stream-then-captured order; node tracing and API instrumentation perturb timing. Driver total_ns includes profiler startup/stop and deferred output, so do not use it as replay latency. Kernel-active fraction excludes non-kernel device engines and does not prove all SMs are busy. Remaining gaps require further attribution before changing execution policy."

