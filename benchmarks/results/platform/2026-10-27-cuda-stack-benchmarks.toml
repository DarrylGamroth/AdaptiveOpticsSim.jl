notes = ["Initial histogram verifier subtracted mixed signed/unsigned values and underflowed. The corrected signed verifier passed all 48 histograms and 240000 samples; no histogram or timing data changed.", "Candidate fine optical timings were not emitted because the unchanged allocation assertion stops before the timed phase.", "Three initial instrument attempts used an unjustified exact cross-prepared Float32 rate oracle. The diagnostic measured 1.414e-7 relative L2, within the maintained 1e-3 criterion. Corrected harness, preserved initial failures, reran three jobs at end; no numerical kernel or allocation gate changed.", "Two initial metadata probes used a nonexistent private preference name; corrected metadata retries preserved separately. These are not benchmark failures.", "Three diagnostic pauses stopped only our Python scheduler after its active child finished. Wrapper elapsed_s for physical-copper_fine-baseline-1, physical-copper_default-baseline-2 and physical-gpi_default-baseline-2 includes waiting for diagnostics; inner sample timings remain the comparison.", "Exploratory profiles with immutable return boxes and collector compilation retained; final warmed concrete no-return diagnostic has neither artifact.", "Instrument data frozen from committed simulations source; unrelated uncommitted user changes excluded. Exact provenance and hashes retained."]

