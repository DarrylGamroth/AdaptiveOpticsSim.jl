artifact_id = "CUDA-COMPLETION-GEOMETRIC-SLOPES-2026-10-21"
baseline_revision = "325cdde781083cc756d6b2f88caaea2682ebc65f"
implementation_state = "Baseline plus production/test/benchmark changes identified by source hashes; scientific formulas, CPU implementation, and edge-masked slopes unchanged."
decision = "Use blocking current-stream completion for synchronous CUDA kernel phases. Use cooperative summation for same-precision Float32/Float64 subapertures with at least five pixels per side on grids no larger than 32 × 32. Retain original serial execution elsewhere."

[environment]
gpu = "NVIDIA GeForce RTX 3080; sm_86; 68 SMs; 10 GiB"
cpu = "AMD Ryzen 7 6800H"
julia = "1.13.2"
cuda_jl = "6.4.2"
kernel_abstractions = "0.9.45"
cuda_runtime = "13.4.0"
driver = "615.71.09"
threads = "1 compute, 0 interactive, 1 GC; BLAS/FFT 1"
affinity = "Julia CPU 2; passive monitor CPU 6"
clocks = "Uncontrolled system defaults; shared host"
manifest_sha256 = "30a87806f0b9cbbe27d951f019f9f801d46236fe3e1792aab716c5ea8014ef73"

[implementation]
slopes = "Every horizontal and vertical adjacent difference contributes once, averaged by sub(sub-1) and scaled in the original order. One 32-lane group per eligible subaperture; parallel addition order changes rounding."
exceptions = "Nonfinite differences or differences above floatmax/(2count)/max(1,abs(scales)) select the original serial sum. Subapertures smaller than five pixels, grids larger than 32 × 32, mixed/unusual types and nonfinite scales use original serial dispatch. Invalid subapertures suppress OPD reads; sub=1 is unchanged."
completion = "CUDA synchronous kernel phases now use CUDA.synchronize(current_stream;blocking=true), retaining device-exception checks. Low-level callers may select blocking=false. Calling-thread task cooperation changes; no global callback/concurrency guarantee is inferred."
capture = "Prepared graph completion code and fixed-storage guard are unchanged. Private asynchronous slope enqueue permits fixed-storage capture. Float32/64 slope replay passes zero warmed host-byte assertions; public dynamic KA launch allocations are measured separately."
crossover = "Small subapertures (three/four pixels) regressed in pilots. A separate output-density pilot found regressions with one group per output on dense grids. The final policy restricts cooperative execution to a conservative measured region; it is not an optimal crossover model. Pilot and final density samples are archived separately."

[protocol]
fresh_processes_per_revision = 3
process_order = "before1, after1, before2, after2, before3, after3; each process runs geometric cases then Pyramid cases in fixed order."
workflow = "Captured Gaussian DM → pupil OPD graph followed by public geometric_wavefront_slopes!; completed GPU slopes. CPU-oracle host copies are outside timing. 128 closed-loop time_ns samples after 32 warmups per case. Combined kernel and completion-policy effect."
oracles = "Command scales 0, -0.7, 1.3 and 1: complete CPU workflow compared to GPU before timing; post-timing parity and CUDA.used_memory stability. Each Pyramid strategy compared to CPU before and after. All passed."
kernel = "Within each after process, original serial versus actual production-selected asynchronous enqueue. Four ABBA groups, 32 CUDA events per block, 32 repeated kernels per event. Every output is overwritten. Event time includes amortized native graph scheduling; no public wait or input transfer."
paired_formula = "For each ABBA group: mean(log(serial block p50)) − mean(log(selected block p50)); exponentiate the mean of four groups per process. Report three process values separately. Ratio > 1 means selected is faster."
total_workflow_samples = 3840
total_pyramid_samples = 3072
total_kernel_event_samples = 15360
timed_gc_collections = 0
limitations = "One RTX 3080 and software stack; shared host and uncontrolled clocks. Always-before-first process order and fixed case order can bias small effects. The 128 closed-loop samples support descriptive medians, not fixed-rate, tail-latency or WCET claims. Host output copies, RTC and transport are outside the timed boundary. Density sweep uses Float32 and a deterministic mask with about 20% invalid subapertures. No throughput claim for other backends or mask distributions."

[validation]
ka_cpu_numerical_checks = 824
cuda_numerical_checks = 824
cuda_public_api_checks = 4
cuda_fixed_storage_slope_checks = 6
cuda_capture_graph_regression_checks = 91
cuda_completion_storage_wait_multiplication_checks = 333
coverage = "Float32/64; subapertures 1/2/3/4/5/16/32; constant, plane, spike, checkerboard, large offset, subnormal and non-dyadic cancellation inputs; BigFloat exact-input reference with absolute error bounds; anisotropic scales; NaN/Inf/overflow; invalid masks; mixed precision; edge-mask parity; 32/33 output-grid boundary; current-stream/context restoration; default blocking and explicit cooperative completion; captured replay with zero warmed host bytes."
commands = ["julia --project=test/cuda -e 'include(\"test/cuda/geometric_slopes.jl\"); include(\"test/runtests_gpu_target_common.jl\"); B=Backends.CUDABackendTag; @testset \"capture\" begin; run_captured_coordinate_gaussian_graph_execution_smoke(B); run_captured_graph_execution_smoke(B); run_captured_atmosphere_replay_smoke(B); run_captured_wfs_replay_smoke(B); run_captured_detector_replay_smoke(B); run_grouped_graph_execution_smoke(B); run_graph_rng_capture_replay(B); end'", "julia --project=test/cuda -e 'include(\"test/cuda/kernel_completion.jl\"); include(\"test/cuda/captured_storage.jl\"); include(\"test/cuda/prepared_wait.jl\"); include(\"test/cuda_prepared_multiplication_capture.jl\")'"]

[executor_comparison]
aos_revision = "325cdde781083cc756d6b2f88caaea2682ebc65f"
juliafiltergraph_revision = "02a8ad1bc23f478e6637047c9862adf7c6b36775"
scope = "Read-only source and existing-test review; no direct executor performance comparison."
juliafiltergraph_strengths = "Generic streaming declaration API, conditional/rejected/deferred samples, joins and pipelines, per-node commitment and a richer retained fault/lifetime protocol."
aos_fit = "Resident physical plant arrays, explicit plan/state/workspace/binding owners, model time, capacity-one asynchronous tickets and selective observation. Ordinary JFG captured process stages host outputs and waits every frame; publication and lifecycle contracts differ."
recommendation = "Keep the package boundary and AOS executor. Consider borrowing documented stateful capture hooks, retained failure diagnostics, a failed-drain storage lifetime protocol, and an optional declaration helper. No executor API redesign is included here."

[commands]
common = "JULIA_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1; taskset -c 2; julia --startup-file=no --threads=1,0 --gcthreads=1 --project=<checkout>/test/cuda"
geometric = "AOS_BENCHMARK_ROOT=<checkout> AOS_GEOMETRIC_RESULTS=/tmp/geometric.toml julia --project=<checkout>/test/cuda <driver>/benchmarks/benchmark_geometric_slopes_workflow_cuda.jl cuda"
campaign = "See archived run_campaign.py; same driver files executed in fresh checkout-specific projects; default Pyramid mode asserted."
telemetry = "nvidia-smi SM/memory clocks, pstate, temperature, power and clock event reasons every nominal 100 ms plus query latency. Begin/end CLOCK_MONOTONIC retained. Includes cold phases; no timing-interval attribution or stability claim."

