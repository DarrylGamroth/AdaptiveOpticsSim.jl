schema_version: 1
name: ingaas_pixel_mtf
nodes:
  - name: response
    type: pixel_mtf
    config:
      input_shape: [3, 5]
      padding: 2
      input_schema: test.ingaas.photon-rate/1
      output_schema: test.ingaas.photon-rate/1
    bindings:
      transfer: calibrated_transfer
  - name: camera
    type: detector
    detector: ingaas
    config:
      shutter: global
      rows: 3
      columns: 5
      pixel_sampling_m: [0.000012, 0.000014]
      spectral_channel: test_ingaas_band
      exposure_duration_s: 0.5
      quantum_efficiency: 0.75
      gain: 2
      dark_current_e_per_pixel_s: 2
      glow_e_per_pixel_s: 3
      bits: 12
      full_well_e: 1000
      photon_noise: true
      readout_noise: true
      readout_noise_e: 0.7
      persistence_model:
        mode: exponential
        coupling: 0.25
        decay: 0.5
      nonlinearity_model:
        mode: saturating
        coefficient: 0.01
      rng_seed: 43969
      photon_rate_schema: test.ingaas.photon-rate/1
      frame_schema: test.ingaas.frame/1
inputs:
  - name: photons
    destination: response.input
    binding: photons
links:
  - source: response.output
    destination: camera.photon_rate
outputs:
  - name: filtered
    source: response.output
  - name: frame
    source: camera.frame
