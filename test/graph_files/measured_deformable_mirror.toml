schema_version = 1
name = "measured_deformable_mirror"

[[nodes]]
name = "dm"
type = "deformable_mirror_surface_f32"

[nodes.config]
resolution = 2
telescope_diameter_m = 1.22
actuator_count = 2
pdm_command_schema = "test.graph.pdm-command.f32/1"
surface_opd_schema = "test.graph.dm-surface-opd.f32/1"
actuator_coordinates_schema = "test.graph.dm-actuator-coordinates.f32/1"
influence_functions_schema = "test.graph.dm-influence-functions.f32/1"

[[inputs]]
name = "pdm_command"
destination = "dm.pdm_command"
binding = "pdm_command"

[[outputs]]
name = "surface_opd"
source = "dm.surface_opd"

[[parameters]]
destination = "dm.actuator_coordinates"
binding = "actuator_coordinates"

[[parameters]]
destination = "dm.influence_functions"
binding = "influence_functions"
