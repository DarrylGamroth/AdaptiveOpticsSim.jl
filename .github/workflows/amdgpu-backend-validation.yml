name: AMDGPU Backend Validation

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  amdgpu:
    runs-on: [self-hosted, linux, amdgpu]
    timeout-minutes: 120
    env:
      JULIA_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v3

      - name: Instantiate AMDGPU test project
        run: julia --project=test/amdgpu --startup-file=no -e 'using Pkg; Pkg.instantiate()'

      - name: Run maintained AMDGPU hardware target
        run: julia --project=test/amdgpu --startup-file=no test/runtests_amdgpu.jl

      - name: Run focused AMDGPU extension coverage
        env:
          ADAPTIVEOPTICS_TEST_COVERAGE: "true"
        run: julia --project=test/amdgpu --startup-file=no --code-coverage=user test/amdgpu/extension_coverage.jl

      - name: Process AMDGPU coverage
        uses: julia-actions/julia-processcoverage@v1
        with:
          directories: src/backends,ext

      - name: Upload AMDGPU coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: lcov.info
          disable_search: true
          fail_ci_if_error: true
          name: adaptiveopticssim-amdgpu
          use_oidc: true
