name: Coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  shard-coverage:
    name: Shard coverage / ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard:
          - ci-foundations
          - ci-sensors-control
          - ci-plant-runtime
          - ci-plant-optics
    env:
      ADAPTIVEOPTICS_TEST_COVERAGE: "true"
      ADAPTIVEOPTICS_TEST_SHARD: ${{ matrix.shard }}
      JULIA_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v3

      - name: Instantiate
        run: julia --project=. --startup-file=no -e 'using Pkg; Pkg.instantiate()'

      - name: Run bounded test shard with coverage
        run: julia --project=. --startup-file=no -e 'using Pkg; Pkg.test(coverage=true, test_args=[ENV["ADAPTIVEOPTICS_TEST_SHARD"]])'

  project-coverage:
    name: Project coverage / full composition
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ADAPTIVEOPTICS_TEST_COVERAGE: "true"
      JULIA_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v3

      - name: Instantiate
        run: julia --project=. --startup-file=no -e 'using Pkg; Pkg.instantiate()'

      - name: Run full composition with coverage
        run: julia --project=. --startup-file=no -e 'using Pkg; Pkg.test(coverage=true)'

      - name: Process project Julia coverage
        uses: julia-actions/julia-processcoverage@v1
        with:
          directories: src,ext

      - name: Upload project coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: lcov.info
          disable_search: true
          fail_ci_if_error: true
          name: adaptiveopticssim-project
          use_oidc: true
