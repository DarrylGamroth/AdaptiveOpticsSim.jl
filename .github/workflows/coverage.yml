name: Coverage

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  project-coverage:
    name: Full project coverage
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ADAPTIVEOPTICS_TEST_COVERAGE: "true"
      JULIA_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"
      - uses: julia-actions/cache@v3
      - name: Instantiate
        run: julia --project=. --startup-file=no -e 'using Pkg; Pkg.instantiate()'
      - name: Run full composition with coverage
        run: julia --project=. --startup-file=no -e 'using Pkg; Pkg.test(coverage=true)'
      - name: Process Julia coverage
        uses: julia-actions/julia-processcoverage@v1
        with:
          directories: src,ext
      - name: Upload project coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: lcov.info
          disable_search: true
          fail_ci_if_error: true
          name: adaptiveopticssim-project
          use_oidc: true
