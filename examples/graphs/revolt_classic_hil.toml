# REVOLT Classic HIL sensor boundary.
#
# The surrounding AOS simulation owns atmosphere evolution and evaluates the
# uncompensated optical path. A serialized RTC adapter places one complete PDM
# command in the caller-owned command buffer before each graph step. This graph
# applies that command through caller-qualified measured actuator coordinates
# and influence functions, composes the resulting surface OPD with the
# uncompensated pupil OPD, forms the diffractive Shack-Hartmann photon-rate
# mosaic, and completes one noisy CCD frame suitable for publication through a
# transport adapter such as PipeWireAO.
#
# Optical and detector values follow
# REVOLT/Python/specula/params_revolt_modal.yml. The explicit RNG seed is an
# AOS reproducibility choice because the source file does not declare one.
# The available AX307_Influences.fits artifact belongs to the 468-actuator
# BAX307/SPIDERS mirror and is not a REVOLT HSDM277 influence calibration. This
# file therefore requires the application to bind a separately qualified
# 277-actuator matrix and makes no synthetic-influence instrument claim.

schema_version = 1
name = "revolt_classic_hil"

[[nodes]]
name = "pdm"
type = "deformable_mirror_surface_f32"

[nodes.config]
resolution = 240
telescope_diameter_m = 1.22
central_obstruction_ratio = 0.20491803278688525
pupil_reflectivity = 1.0
aperture_revision = 1
actuator_count = 277
pdm_command_schema = "org.revolt.classic.pdm-command.f32/1"
surface_opd_schema = "org.revolt.classic.pdm-surface-opd.f32/1"
actuator_coordinates_schema = "org.revolt.classic.pdm-actuator-coordinates.f32/1"
influence_functions_schema = "org.revolt.classic.pdm-influence-functions.f32/1"

[[nodes]]
name = "pupil_opd_composition"
type = "pupil_opd_composition_f32"

[nodes.config]
resolution = 240
uncompensated_opd_schema = "org.revolt.classic.uncompensated-pupil-opd.f32/1"
surface_opd_schema = "org.revolt.classic.pdm-surface-opd.f32/1"
pupil_opd_schema = "org.revolt.classic.pupil-opd.f32/1"

[[nodes]]
name = "shwfs"
type = "shack_hartmann_rate_f32"

[nodes.config]
resolution = 240
telescope_diameter_m = 1.22
central_obstruction_ratio = 0.20491803278688525
pupil_reflectivity = 1.0
aperture_revision = 1
n_lenslets = 16
n_pix_subap = 22
diffraction_padding = 2
pixel_scale_arcsec = 0.697
valid_subaperture_threshold = 0.1
threshold_convolution = 0.05
half_pixel_shift = false
shannon_sampling = true
source_band = "R"
source_magnitude = 2.0
source_wavelength_m = 8.0e-7
source_separation_arcsec = 0.0
source_position_angle_deg = 0.0
opd_schema = "org.revolt.classic.pupil-opd.f32/1"
photon_rate_schema = "org.revolt.classic.shwfs-photon-rate.f32/1"

[[nodes]]
name = "detector"
type = "ccd_detector_acquisition_f32"

[nodes.config]
rows = 352
columns = 352
binning = 1
pixel_scale_arcsec = 0.697
wavelength_m = 8.0e-7
exposure_duration_s = 0.001
quantum_efficiency = 0.5
photon_noise = true
readout_noise = true
readout_noise_e = 2.7
rng_seed = 0
photon_rate_schema = "org.revolt.classic.shwfs-photon-rate.f32/1"
frame_schema = "org.revolt.classic.shwfs-frame.f32/1"

[[inputs]]
name = "pdm_command"
destination = "pdm.pdm_command"
binding = "pdm_command"

[[inputs]]
name = "uncompensated_pupil_opd"
destination = "pupil_opd_composition.uncompensated_opd"
binding = "uncompensated_pupil_opd"

[[outputs]]
name = "pdm_surface_opd"
source = "pdm.surface_opd"

[[outputs]]
name = "pupil_opd"
source = "pupil_opd_composition.pupil_opd"

[[outputs]]
name = "shwfs_photon_rate"
source = "shwfs.photon_rate"

[[outputs]]
name = "shwfs_frame"
source = "detector.frame"

[[links]]
source = "pdm.surface_opd"
destination = "pupil_opd_composition.surface_opd"

[[links]]
source = "pupil_opd_composition.pupil_opd"
destination = "shwfs.opd"

[[links]]
source = "shwfs.photon_rate"
destination = "detector.photon_rate"

[[parameters]]
destination = "pdm.actuator_coordinates"
binding = "pdm_actuator_coordinates"

[[parameters]]
destination = "pdm.influence_functions"
binding = "pdm_influence_functions"
